# Tabella di normalizzazione nomi -> slug stabili.
# Regola: ogni nome letto dal wiki deve risolversi qui. Un nome sconosciuto fa FALLIRE l'estrazione:
# niente euristiche silenziose. Se il wiki rinomina qualcosa, si aggiunge l'alias a mano.
#
# L'ordine dei personaggi è l'ordine del "Core roster" nella navbox del wiki e diventa rosterOrder.

characters:
  mario:          { name: "Mario" }
  luigi:          { name: "Luigi" }
  # wikiPage: "Peach" è una pagina di redirect verso "Princess Peach" (l'articolo vero, con la
  # tabella "Names in other languages"): richiesto direttamente per evitare che il nome del file di
  # fixture (che usa il titolo RISOLTO) non corrisponda al titolo richiesto da sources.yaml/aliases.yaml.
  peach:          { name: "Peach", aliases: ["Princess Peach"], wikiPage: "Princess Peach" }
  daisy:          { name: "Daisy", aliases: ["Princess Daisy"] }
  yoshi:          { name: "Yoshi" }
  donkey_kong:    { name: "Donkey Kong", aliases: ["DK"] }
  bowser:         { name: "Bowser" }
  bowser_jr:      { name: "Bowser Jr." }
  koopa_troopa:   { name: "Koopa Troopa" }
  toad:           { name: "Toad" }
  toadette:       { name: "Toadette" }
  lakitu:         { name: "Lakitu" }
  king_boo:       { name: "King Boo" }
  shy_guy:        { name: "Shy Guy" }
  wario:          { name: "Wario" }
  waluigi:        { name: "Waluigi" }
  birdo:          { name: "Birdo" }
  pauline:        { name: "Pauline" }
  rosalina:       { name: "Rosalina" }
  baby_mario:     { name: "Baby Mario" }
  baby_luigi:     { name: "Baby Luigi" }
  baby_peach:     { name: "Baby Peach" }
  baby_daisy:     { name: "Baby Daisy" }
  baby_rosalina:  { name: "Baby Rosalina" }

# I 30 corsi principali. "aliases" contiene i titoli di pagina a cui puntano i link del wiki
# (attributo title dei tag <a>), che spesso hanno un disambiguatore tra parentesi. "wikiPage"
# (presente solo quando diverso da "name") è la pagina da cui seedgen/i18n.py estrae il nome
# ufficiale in italiano: non sempre coincide con un alias qui sopra, perché molti corsi riappaiono
# da giochi precedenti e il titolo senza disambiguatore può essere una pagina di disambiguazione o
# panoramica multi-gioco, non l'articolo con la tabella "Names in other languages" giusta.
courses:
  mario_bros_circuit:   { name: "Mario Bros. Circuit" }
  crown_city:           { name: "Crown City" }
  whistlestop_summit:   { name: "Whistlestop Summit" }
  dk_spaceport:         { name: "DK Spaceport" }
  desert_hills:         { name: "Desert Hills" }
  shy_guy_bazaar:       { name: "Shy Guy Bazaar" }
  wario_stadium:        { name: "Wario Stadium", aliases: ["Wario Stadium (Mario Kart 64)", "N64 Wario Stadium"], wikiPage: "Wario Stadium (Mario Kart 64)" }
  airship_fortress:     { name: "Airship Fortress" }
  dk_pass:              { name: "DK Pass" }
  starview_peak:        { name: "Starview Peak" }
  sky_high_sundae:      { name: "Sky-High Sundae" }
  wario_shipyard:       { name: "Wario Shipyard" }
  # wikiPage: "Koopa Beach" (non un alias qui sopra) è la pagina di disambiguazione del nome, ma è
  # anche l'unica con una tabella "Names in other languages" propria per il nome attuale (citazione
  # dell'annuncio di Mario Kart World, aprile 2025) — le pagine per singolo gioco (Super Mario Kart,
  # Mario Kart 64) hanno traduzioni storiche diverse, non quella corrente.
  koopa_troopa_beach:   { name: "Koopa Troopa Beach", aliases: ["Koopa Troopa Beach (Super Mario Kart)"], wikiPage: "Koopa Beach" }
  faraway_oasis:        { name: "Faraway Oasis" }
  peach_stadium:        { name: "Peach Stadium" }
  peach_beach:          { name: "Peach Beach" }
  salty_salty_speedway: { name: "Salty Salty Speedway" }
  dino_dino_jungle:     { name: "Dino Dino Jungle" }
  great_q_block_ruins:  { name: "Great ? Block Ruins" }
  cheep_cheep_falls:    { name: "Cheep Cheep Falls", aliases: ["Cheep Cheep Falls (race course)"], wikiPage: "Cheep Cheep Falls (race course)" }
  dandelion_depths:     { name: "Dandelion Depths" }
  boo_cinema:           { name: "Boo Cinema" }
  dry_bones_burnout:    { name: "Dry Bones Burnout" }
  moo_moo_meadows:      { name: "Moo Moo Meadows" }
  choco_mountain:       { name: "Choco Mountain" }
  toads_factory:        { name: "Toad's Factory" }
  bowsers_castle:       { name: "Bowser's Castle", aliases: ["Bowser's Castle (Mario Kart World)"], wikiPage: "Bowser's Castle (Mario Kart World)" }
  acorn_heights:        { name: "Acorn Heights" }
  mario_circuit:        { name: "Mario Circuit", aliases: ["Mario Circuit (Mario Kart World)"], wikiPage: "Mario Circuit (Mario Kart World)" }
  rainbow_road:         { name: "Rainbow Road", aliases: ["Rainbow Road (Mario Kart World)"], wikiPage: "Rainbow Road (Mario Kart World)" }

# Equivalenze dichiarate dalla pagina Dash Food: "Baby Peach, Baby Daisy, and Baby Rosalina always get
# the same outfits as each other from a Dash Food, as do Toad and Toadette (with Burger Bud and Soft Server
# as well as Engineer and Conductor being treated as equivalents)".
# La validazione controlla che ogni gruppo di cibo le rispetti: se non succede, il parser ha letto male.
equivalences:
  - characters: [baby_peach, baby_daisy, baby_rosalina]
  - characters: [toad, toadette]
    outfit_map: { "Soft Server": "Burger Bud", "Conductor": "Engineer" }

# Link presenti nelle celle dei corsi che NON sono corsi e vanno ignorati esplicitamente.
# Esempio: nella navbox, la Special Cup elenca "Mario Circuit (1 · 2 · 3)" con link alle versioni SNES.
ignored_course_links:
  - "Mario Circuit 1"
  - "Mario Circuit 2"
  - "Mario Circuit 3"

# Gruppi di cibo. Un gruppo = una cella Outfits distinta della tabella Dash Food.
# "aliases" contiene gli altri nomi di cibo che compaiono nella stessa cella: devono risolversi allo stesso id.
food_groups:
  hamburger:     { name: "Hamburger" }
  donut:         { name: "Donut" }
  spicy_curry:   { name: "Spicy curry" }
  barbecue:      { name: "Barbecue" }
  wild_bone:     { name: "Wild bone" }
  pancakes:      { name: "Pancakes" }
  ice_cream:     { name: "Ice cream" }
  magma_curry:   { name: "Magma curry" }
  fruit_barrel:  { name: "Fruit barrel" }
  moo_moo_milk:  { name: "Moo Moo Milk" }
  cake:          { name: "Cake" }
  bread:         { name: "Bread" }
  pizza:         { name: "Pizza" }
  fritters:      { name: "Fritters & potatoes" }
  sushi:         { name: "Sushi", aliases: ["Takoyaki", "Candy apple", "Cheep Cheep taiyaki"] }
  snacks_1:      { name: "Snacks 1" }
  snacks_2:      { name: "Snacks 2" }
  snacks_3:      { name: "Snacks 3" }
  popcorn:       { name: "Popcorn" }
  lunchbox:      { name: "Lunchbox" }

# Etichette della colonna "Dash Food" nella pagina "List of Yoshi's locations" -> gruppi.
# Una cella può contenere più etichette, separate da <br> o virgole (es. "Chips, soft drinks, chocolate bars").
# Gli snack stanno negli stessi chioschi, quindi un'etichetta di snack vale per tutti e tre i gruppi.
yoshi_food_labels:
  "Burgers":        [hamburger]
  "Donuts":         [donut]
  "Flatbread":      [spicy_curry]
  "Kebabs":         [barbecue]
  "Meat":           [wild_bone]
  "Pancakes":       [pancakes]
  "Ice cream":      [ice_cream]
  "Curry":          [magma_curry]
  "Fruit salad":    [fruit_barrel]
  "Milk":           [moo_moo_milk]
  "Cake":           [cake]
  "Baked goods":    [bread]
  "Pizza":          [pizza]
  "Fish and chips": [fritters]
  "Sushi":          [sushi]
  "Takoyaki":       [sushi]
  "Candy apples":   [sushi]
  "Taiyaki":        [sushi]
  "Popcorn":        [popcorn]
  "Lunchboxes":     [lunchbox]
  "Chips":          [snacks_1, snacks_2, snacks_3]
  "Snacks":         [snacks_1, snacks_2, snacks_3]
  "Soft drinks":    [snacks_1, snacks_2, snacks_3]
  "Chocolate bars": [snacks_1, snacks_2, snacks_3]

# Le 10 regioni del mondo di gioco, con i nomi dei biomi usati da "List of Mario Kart World missions"
# (intestazioni h2). Coincidono con le 10 regioni della guida Nintendo Life ai medaglioni.
# Appartenenza dei corsi: verificata sulla pagina missioni per Mesa, Southern sea e Desert; per le altre
# ricavata dalla guida Nintendo Life. La validazione controlla che ogni missione stia nel bioma del
# proprio corso: un'assegnazione sbagliata qui fa fallire l'estrazione.
regions:
  mesa:              { name: "Mesa biome", courses: [mario_bros_circuit, whistlestop_summit, wario_stadium] }
  southern_sea:      { name: "Southern sea and coast", courses: [crown_city, dk_spaceport, koopa_troopa_beach] }
  desert:            { name: "Desert biome", courses: [desert_hills, shy_guy_bazaar] }
  volcanic:          { name: "Volcanic biome", courses: [airship_fortress, bowsers_castle, dry_bones_burnout] }
  snow:              { name: "Snow biome", courses: [dk_pass, sky_high_sundae, starview_peak] }
  eastern_sea:       { name: "Eastern sea and coast", courses: [salty_salty_speedway, wario_shipyard, peach_beach] }
  savanna_jungle:    { name: "Savanna and jungle biome", courses: [dino_dino_jungle, faraway_oasis, great_q_block_ruins] }
  central_grassland: { name: "Central grassland biome", courses: [choco_mountain, moo_moo_meadows, peach_stadium, toads_factory] }
  autumnal_highland: { name: "Autumnal and highland biome", courses: [cheep_cheep_falls, dandelion_depths] }
  forest:            { name: "Forest biome", courses: [acorn_heights, boo_cinema, mario_circuit] }

# Luoghi che compaiono nella colonna Location delle missioni ma non sono uno dei 30 corsi.
# Elenco incompleto per costruzione: un luogo nuovo fa fallire l'estrazione e va aggiunto qui con la sua regione.
areas:
  chain_chomp_desert: { name: "Chain Chomp Desert", region: desert }
  big_donut: { name: "Big Donut", region: volcanic }
