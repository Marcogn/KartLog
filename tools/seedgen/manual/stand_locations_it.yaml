# Luoghi e tipi di locale degli stand Yoshi's, in italiano — TRADUZIONE NON UFFICIALE.
#
# Fonte: colonne "Establishment" e "Location" della pagina "List of Yoshi's locations" di Super
# Mario Wiki (seedgen/parse.py, parse_yoshis). Nessuna fonte ha questi testi in italiano: l'autore
# ha scelto il 05/10/2026 di tradurli a mano e dichiararlo (qui, nel README, in seed/LICENSE e in
# Impostazioni/Info), come i nomi dei cibi e la modalità specchio.
#
# `en` è il testo esatto estratto dal wiki: se un testo nuovo non ha la sua voce, o una voce non
# corrisponde più a nessuno stand, seedgen si ferma finché questo file non viene aggiornato.
# I corsi usano il nome italiano ufficiale (courses.json, da mariowiki); i nomi propri di luoghi e
# marchi senza un nome italiano noto (Crown Bridge, Pipeline Hotel, Vanilla Lake…) restano in inglese.

