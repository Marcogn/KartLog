# L'autore ha scelto il 26/09/2026 di mostrarli comunque in italiano con una traduzione fatta a mano,
# dichiarata come non ufficiale (qui, nel README e in Impostazioni/Info). Chiave = nome inglese del
# cibo come compare nella tabella "List of food" di Dash Food; un cibo senza voce resta in inglese.
# "Pesce Smack" è il nome di Cheep Cheep usato da mariowiki.it per Mario Kart World.

