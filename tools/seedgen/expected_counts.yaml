# Conteggi attesi. Unica fonte di verità per lo script (seedgen) e per i test Kotlin dell'app.
#
# Se un aggiornamento del gioco cambia questi numeri, vanno modificati A MANO, in un commit dedicato
# che cita la fonte. Non vanno mai rilassati per far passare la build.
#
# Verifica 25/09/2026: conteggio sulla tabella "List of food" della pagina Dash Food
# (ultima modifica 19/08/2026), coerente con la guida Nintendo Life "All Costume Unlocks".

# Versione del gioco a cui si riferiscono i dati (non estraibile dal wiki: si aggiorna a mano).
game_version: "1.8.0"

characters_with_outfits: 24

# Piloti selezionabili, con e senza outfit. Verifica 26/09/2026: gallerie "Default drivers" (32) e
# "Unlockable drivers" (18) della pagina "Mario Kart World" di Super Mario Wiki (revid 5498278),
# stessi numeri sulla pagina "Mario Kart World" di mariowiki.it (sezioni "Di base" e "Sbloccabili").
drivers: 50
starter_drivers: 32
alternative_outfits: 103
total_outfits_including_default: 127

# Gruppi "di outfit": ogni cella Outfits distinta della tabella è un gruppo.
# 19 gruppi danno outfit + 1 (Lunchbox) che riporta al default.
food_groups: 20
food_groups_reverting_to_default: 1

courses: 30
cups: 8
courses_per_cup: 4
rallies: 12
stops_per_rally: 6

regions: 10

# Totali confermati dal contatore in-game (dalla patch 1.2.0 diventa dorato a raccolta completa),
# riportati da mariowiki e Game8.
peach_medallions: 200
p_switches: 394

# Verifica 28/09/2026: pagina "? Panel" di Super Mario Wiki ("There are 150 ? Panels in total, with ten in
# Crown City and five in every other course"), stesso numero in mkworld-checklist (commit ee86055).
question_panels: 150

# Verifica 05/10/2026 (fase C1). Pagina "Dash Food" (revid 5455370): "There are 60 kinds of Dash
# Food", una riga per cibo nella tabella "List of food" (il gruppo sushi ne ha quattro, l'ultimo è il
# piatto triplo). Pagina "List of Yoshi's locations" (revid 5263331): 70 righe in "Course locations"
# (21 percorsi) e 39 in "Route locations", ognuna con la sua foto = uno stand.
food_variants: 60
yoshi_course_stands: 70
yoshi_route_stands: 39
