# Android CI: lint, unit tests, release build (R8), forbidden-permissions check. The logic lives in
# the kit (https://github.com/Marcogn/claude-skill-android-kit); here only this project's values.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Marcogn/claude-skill-android-kit/.github/workflows/android-ci.yml@v1
    with:
      app-module: app
      java-version: '17'
      # Permissions the packaged release manifest must not declare (space separated, may be empty).
      # KartLog: INTERNET is needed (images downloaded at runtime), nothing to forbid.
      forbidden-permissions: ''
      coverage: true
    # KartLog: offlineSeed validates seed/ without network, so a pull request never fails (or hits
    # mariowiki.com) because the wiki changed. Gradle reads ORG_GRADLE_PROJECT_<name> as -P<name>
    # (the build only tests hasProperty("offlineSeed")). Build APK and Release stay online.
    secrets:
      BUILD_ENV: "ORG_GRADLE_PROJECT_offlineSeed=true"
